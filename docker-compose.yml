services:
  mysql:
    image: mysql:8.4
    command: --max-connections=500
    environment:
      MYSQL_ROOT_PASSWORD: changeme-root
      MYSQL_DATABASE: seats
      MYSQL_USER: app
      # Must match the password in ConnectionStrings__Mysql in .env
      MYSQL_PASSWORD: changeme
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Inside the compose network the DB host is the service name, not the
      # "localhost" in .env.example (which targets the port published below
      # for a local, non-containerized `dotnet run`).
      ConnectionStrings__Mysql: Server=mysql;Port=3306;Database=seats;User ID=app;Password=changeme;Maximum Pool Size=50;Connection Timeout=5;SslMode=Preferred
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
